spring.application.name=PolicySystem

# Test Database Configuration - Using in-memory H2
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=test-secret-key-for-testing-only
app.jwt.expiration.access-token=900000
app.jwt.expiration.refresh-token=604800000

# Server Configuration
server.servlet.context-path=/
server.port=8080
