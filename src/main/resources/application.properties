spring.application.name=PolicySystem

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/policy_system
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration.access-token=900000
app.jwt.expiration.refresh-token=604800000

# Server Configuration
server.servlet.context-path=/
server.port=8080
